<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>值植質 - 數位專刊</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <p class="school-info">國立雲林科技大學 數位媒體設計系 115 級畢業專刊</p>
        </header>

        <main class="main-content">
            <div class="visual-container" data-aos="fade-right">
                <img src="svg/AN.svg" class="hud hud-tl" alt="AN-XX">
                <img src="svg/IN.svg" class="hud hud-br" alt="IN-XX">
                <img src="svg/MD.svg" class="hud hud-bl" alt="MD-XX">
                
                <div class="flower-wrapper">
                    <img src="svg/FLOWER.png" class="flower-img static" alt="花1">
                </div>
            </div>

            <div class="content-section" data-aos="fade-left">
                <div class="logo-wrapper">
                    <img src="svg/test.svg" class="main-logo" alt="值植質">
                </div>
                
                <p class="concept-text">
                    將「創作」視為一種神經傳導的現象，思考與情感在體內以訊號的形式傳遞，最終轉化為具象的創造行為
                </p>

                <div class="button-group">
                    <a href="#" id="openCatalogBtn" class="btn-main">線上瀏覽</a>
                    <a href="catalog2.pdf" download="值植質_專刊" class="btn-main">下載收藏</a>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="event-info">
                <span>校內展 | 2026.04.16 - 04.19</span>
                <span>新一代 | 2026.05.22 - 05.25</span>
                <span>放視大賞 | 2026.05.28 - 05.30</span>
            </div>
        </footer>
    </div>

<div id="catalogModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <iframe src="catalog2.pdf" class="pdf-viewer" frameborder="0"></iframe>
        </div>
    </div>
<script>
        const modal = document.getElementById("catalogModal");
        const btn = document.getElementById("openCatalogBtn");
        const span = document.getElementsByClassName("close-btn")[0];

        // 點擊「線上瀏覽」時的動作
        btn.onclick = function(e) {
            e.preventDefault(); // 防止畫面跳到網頁最上方

            // 1. 偵測是否為 iOS 裝置 (iPhone, iPod, 舊版 iPad)
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            
            // 2. 偵測是否為新版 iPadOS (Apple 把新版 iPad 偽裝成 Mac，所以要加測觸控點)
            const isMacWithTouch = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;

            if (isIOS || isMacWithTouch) {
                // 如果是蘋果行動裝置：直接在新分頁開啟 PDF，利用 iOS 強大的原生閱讀器
                window.open('catalong2', '_blank');
            } else {
                // 如果是 Android 或電腦版：開啟我們做好的漂亮彈出視窗
                modal.style.display = "block";
            }
        }

        // 點擊右上角 X 時關閉視窗 (針對 Android/電腦)
        span.onclick = function() {
            modal.style.display = "none";
        }

        // 點擊視窗外部的黑色背景時關閉視窗 (針對 Android/電腦)
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 1000,
            once: true
        });
    </script>

</body>
</html>
