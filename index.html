<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>值植質 - 數位專刊</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <p class="school-info">國立雲林科技大學 數位媒體設計系 115 級畢業專刊</p>
        </header>

        <main class="main-content">
            <div class="visual-container" data-aos="fade-right">
                <img src="svg/AN.svg" class="hud hud-tl" alt="AN-XX">
                <img src="svg/IN.svg" class="hud hud-br" alt="IN-XX">
                <img src="svg/MD.svg" class="hud hud-bl" alt="MD-XX">
                
                <div class="flower-wrapper">
                    <img src="svg/FLOWER.png" class="flower-img" alt="值植質-主視覺花朵">
                </div>
            </div>

            <div class="content-section" data-aos="fade-left">
                <div class="logo-wrapper">
                    <img src="svg/test.svg" class="main-logo" alt="值植質">
                </div>
                
                <p class="concept-text">
                    將「創作」視為一種神經傳導的現象，思考與情感在體內以訊號的形式傳遞，最終轉化為具象的創造行為
                </p>

                <div class="button-group">
                    <a href="#" id="openCatalogBtn" class="btn-main">線上瀏覽</a>
                    <a href="115zzz_digitalzine.pdf" download="值植質_專刊" class="btn-main">下載收藏</a>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="event-info">
                <span>校內展 | 2026.04.16 - 04.19</span>
                <span>新一代 | 2026.05.22 - 05.25</span>
                <span>放視大賞 | 2026.05.28 - 05.30</span>
            </div>
        </footer>
    </div>

    <div id="catalogModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            
            <div class="cell-loader">
                <div class="cells-row">
                    <img src="svg/CELL01.svg" class="cell cell-1" alt="cell">
                    <img src="svg/CELL02.svg" class="cell cell-2" alt="cell">
                    <img src="svg/CELL03.svg" class="cell cell-3" alt="cell">
                </div>
                <p class="loading-text">神經訊號傳導中...</p>
            </div>

            <div class="magazine-viewer" id="magazineViewer"></div>
        </div>
    </div>

    <script>
       const modal = document.getElementById("catalogModal");
        const btn = document.getElementById("openCatalogBtn");
        const span = document.getElementsByClassName("close-btn")[0];
        const viewer = document.getElementById("magazineViewer");
        const cellLoader = document.querySelector(".cell-loader");
        
        const totalPages = 106; // 確認這裡是你的總頁數
        let isLoaded = false;   

        // 建立一個嚴格的「圖片觀察員」
        const imageObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                // 當圖片進入到距離螢幕下方 500px 的範圍內時
                if (entry.isIntersecting) {
                    const img = entry.target;
                    img.src = img.dataset.src; // 把隱藏的真實網址塞進去，這時才開始下載！
                    observer.unobserve(img);   // 下載過就不再觀察了
                }
            });
        }, {
            root: viewer, // 以彈出視窗作為滾動基準
            rootMargin: "0px 0px 500px 0px", // 提早 500px 預先載入，確保滑動不卡頓
            threshold: 0
        });

        // 點擊「線上瀏覽」
        btn.onclick = function(e) {
            e.preventDefault();
            modal.style.display = "block";
            
            if (!isLoaded) {
                cellLoader.style.opacity = "1";
                cellLoader.style.display = "flex";

                for (let i = 1; i <= totalPages; i++) {
                    const img = document.createElement('img');
                    
                    // 👈 關鍵修改：不直接給 src，而是藏在 data-src 裡面
                    img.dataset.src = `svg/zzz_Digitalzine-${i}.jpg`; 
                    img.alt = `專刊第 ${i} 頁`;
                    
                    // 為了防止圖片沒載入時高度塌陷，給它一個最小高度
                    img.style.minHeight = "800px"; 

                    // 監聽第 1 張圖的載入狀態來關閉細胞動畫
                    if (i === 1) {
                        img.onload = function() {
                            img.style.minHeight = "auto"; // 載入後恢復原本比例
                            cellLoader.style.opacity = "0";
                            setTimeout(() => {
                                cellLoader.style.display = "none";
                            }, 500);
                        };
                    } else {
                        // 其他圖片載入後也把最小高度取消，保持自適應
                        img.onload = function() {
                            img.style.minHeight = "auto";
                        }
                    }

                    viewer.appendChild(img);
                    
                    // 派觀察員去盯著這張圖片
                    imageObserver.observe(img); 
                }
                isLoaded = true; 
            }
        }

        // 關閉視窗
        span.onclick = function() {
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 1000,
            once: true
        });
    </script>
</body>
</html>
