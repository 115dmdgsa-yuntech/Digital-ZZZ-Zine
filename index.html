<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>值植質 - 數位專刊</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">

        </header>

        <main class="main-content">

                <img src="svg/MD.svg" class="hud hud-bl" alt="MD-XX">

                <div class="logo-wrapper">
                    <img src="svg/LOGO.svg" class="main-logo" alt="值植質">

                <p class="concept-text">
                    將「創作」視為一種神經傳導的現象，思考與情感在體內以訊號的形式傳遞，最終轉化為具象的創造行為
                </p>

                <div class="button-group">
                    <a href="#" class="btn-main">線上瀏覽</a>
                    <a href="catalog.pdf" download="值植質_專刊" class="btn-main">下載留存</a>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="event-info">
                <span>校內展 | 2026.04.16 - 04.19</span>
                <span>新一代 | 2026.05.22 - 05.25</span>

        </footer>
